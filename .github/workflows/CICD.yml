  # ─────────────────────────────────────────
  # DEPLOY — PRODUCTION (main branch)
  # ─────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@v4

      # Mirror the cloud provider block from staging above,
      # pointing at production secrets/services instead.

      - name: Run DB migrations (production)
        run: |
          echo "Running Alembic migrations against production DB..."
          # docker run --rm \
          #   -e DATABASE_URL=${{ secrets.PROD_DATABASE_URL }} \
          #   ${{ needs.build-images.outputs.backend-image }} \
          #   alembic upgrade head

      - name: Smoke test production
        run: |
          sleep 15
          curl --fail ${{ vars.PRODUCTION_URL }}/health || exit 1

      - name: Notify deployment
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "Production deploy ${{ job.status }} for `${{ github.repository }}` @ `${{ github.sha }}`"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
