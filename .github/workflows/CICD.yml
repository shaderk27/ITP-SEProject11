      #     region: ${{ secrets.GCP_REGION }}

      - name: Run DB migrations (staging)
        run: |
          echo "Running Alembic migrations against staging DB..."
          # docker run --rm \
          #   -e DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }} \
